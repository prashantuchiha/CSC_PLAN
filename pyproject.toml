[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "china-masters-research-os"
version = "0.3.0"
description = "A lightweight, evidence-first research foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "mcp>=2,<3",
]

[project.scripts]
china-masters = "china_masters.interfaces.cli.main:app"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/china_masters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["china_masters.application.queries.pagination.Page"]

[tool.mypy]
python_version = "3.12"
files = ["src/china_masters"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
